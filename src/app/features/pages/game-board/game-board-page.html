<div class="game-layout">
  @if (currentUser(); as user) {

  <app-game-table [tableRevealed]="false"></app-game-table>

  @if (gameService.phase() === 'revealed') {
    
    <app-vote-summary></app-vote-summary>

  } @else {
    
    <div [class.loading-fade]="gameService.phase() === 'loading'">
       <app-card-deck></app-card-deck> 
    </div>

  }

  } @else {
  <div class="loading-container">
    <p>Cargando mesa de juego...</p>
  </div>
  }
</div>
