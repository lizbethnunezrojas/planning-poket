<div class="game-layout">
  @if (currentUser(); as user) {

  <app-game-table
    [players]="allPlayers()"
    [tableRevealed]="isTableRevealed()"
    [currentUserId]="user.id"
  ></app-game-table>

  <app-card-deck></app-card-deck>

  } @else {
  <div class="loading-container">
    <p>Cargando mesa de juego...</p>
  </div>
  }
</div>
