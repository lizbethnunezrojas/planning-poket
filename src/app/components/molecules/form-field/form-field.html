<div class="form-field-container">
  
  @if (label) {
    <label [for]="control ? control.value : 'default-id'" class="field-label">
      {{ label }}
    </label>
  }
  
  <app-input-text
    [control]="control"
    [placeholder]="placeholder"
  ></app-input-text>

  @if (errorMessage) {
    <div class="error-message">
      {{ errorMessage }}
    </div>
  }
</div>
