<div class="form-field-container">

  @if (label) {
    <label [for]="inputId" class="field-label">
      {{ label }}
    </label>
  }

  <app-input-text
    [id]="inputId"
    [control]="control"
    [placeholder]="placeholder"
  ></app-input-text>

  @if (errorMessage) {
    <div class="error-message">
      {{ errorMessage }}
    </div>
  }

</div>
