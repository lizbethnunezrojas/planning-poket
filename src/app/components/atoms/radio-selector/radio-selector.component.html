<div class="radio-container">
  <label class="radio-label"> 
    <input
      type="radio"
      [name]="name"
      [value]="value"
      [formControl]="control" 
      class="radio-input"
    />
    <span class="label-text">{{ label }}</span>
    <span class="radio-circle"></span>
  </label>
</div>
