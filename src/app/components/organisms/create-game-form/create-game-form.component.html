<form [formGroup]="createGameForm" (ngSubmit)="onSubmit()" class="create-game-container">
  
  <app-form-field
    label="Nombra la Partida"
    [control]="nameControl" 
    [errorMessage]="nameErrorMessage"
  ></app-form-field>
  
  <app-button
    class="button-create"
    text="Crear partida"
    type="submit"
    [disabled]="createGameForm.invalid"         
  ></app-button>

</form>
