<form [formGroup]="joinForm" (ngSubmit)="onSubmit() " class="join-game-container">

  <app-form-field label="Tu nombre" [control]="nameControl" [errorMessage]="nameErrorMessage"></app-form-field>
  
  <app-mode-selector-group [control]="viewModeControl" class="mode-selector-group"> </app-mode-selector-group>

  <app-button class="button-next" text="Continuar" type="submit" [disabled]="joinForm.invalid">
  </app-button>
  
</form>
