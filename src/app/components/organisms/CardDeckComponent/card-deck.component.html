@if (isPlayer()) {
  <section class="card-deck">
    <h3 class="card-deck__title">Elige una carta 👇</h3>
    
    <div class="card-deck__grid">
      @for (cardValue of availableCards(); track cardValue) {
        <button 
          type="button"
          class="card-deck__button"
          (click)="selectCard(cardValue)">
          <app-card 
            [value]="cardValue.toString()"
            [isSelected]="currentUser()?.selectedCard === cardValue.toString()"
            [isRevealed]="true">
          </app-card>
        </button>
      } @empty {
        <p class="card-deck__empty">No hay cartas registradas.</p>
      }
    </div>
  </section>
}
