<header class="game-header">
  <div class="header-left">
    <img src="logo.png" alt="Logo" class="logo" />
    @if (!gameService.currentGame()) {
    <p class="create-game">Crear partida</p>
    }
  </div>

  <div class="header-center">
    <h1 class="game-title">{{ gameService.currentGame()?.name | capitalizeWords }}</h1>
  </div>

  @if(gameService.currentUser()){ @if(gameService.currentUser()){
  <div class="header-right">
    <div class="avatar-container">
      <button type="button" class="user-avatar" (click)="handleAvatarClick()">
        {{ gameService.currentUser()?.name?.slice(0, 2) }}
      </button>

      @if (isMobile() && isMenuOpen()) {
      <app-user-action-menu [isAdmin]="gameService.isAdmin()" (action)="onMenuAction($event)">
      </app-user-action-menu>
      }
    </div>

    <app-invite-players class="desktop-only"></app-invite-players>
    <app-scoring-mode-selector class="desktop-only"></app-scoring-mode-selector>
  </div>
  } }
</header>
